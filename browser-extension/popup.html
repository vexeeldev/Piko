<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Island Bridge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      padding: 16px;
      background-color: #090909;
      color: #F5F5F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      color: #F5F5F5;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p.desc {
      font-size: 11px;
      color: #A1A1AA;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #A1A1AA;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      background: #141414;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      color: #F5F5F5;
      font-family: monospace;
      font-size: 12px;
      outline: none;
    }
    input:focus {
      border-color: #22C55E;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      background: #22C55E;
      color: #080808;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 4px;
      transition: background-color 0.15s;
    }
    button:hover {
      background: #16A34A;
    }
    .status-bar {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-connected {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ADE80;
    }
    .status-disconnected {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #F87171;
    }
    .hint {
      margin-top: 10px;
      font-size: 10px;
      color: #71717A;
      line-height: 1.3;
    }
    .hint code {
      color: #A1A1AA;
      background: #1C1C1C;
      padding: 1px 4px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h1>
    <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#22C55E;"></span>
    Dynamic Island Call Bridge
  </h1>
  <p class="desc">Connects WhatsApp Web call events to your Linux Dynamic Island widget.</p>

  <div class="field">
    <label for="token">Session Token</label>
    <input type="password" id="token" placeholder="Paste session token from desktop" autocomplete="off" />
  </div>

  <div class="field">
    <label for="port">Local Port</label>
    <input type="number" id="port" value="14425" />
  </div>

  <button id="saveBtn">Save & Test Connection</button>

  <div id="statusBox" class="status-bar status-disconnected" style="display: none;">
    <span id="statusText">Checking connection...</span>
  </div>

  <div class="hint">
    Find token in: <code>~/.config/dynamic-island/session.token</code>
  </div>

  <script src="bridge-client.js"></script>
  <script src="popup.js"></script>
</body>
</html>
